<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up — Algocare</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./assets/style.css">
<style>
  .auth-container { max-width: 420px; margin: 60px auto; padding: 32px; background: var(--card); border: 1px solid var(--grey-line); border-radius: 12px; box-shadow: var(--shadow); }
  .auth-container h2 { text-align: center; margin-bottom: 24px; font-size: 1.75rem; }
  .auth-error { background: var(--brick-soft); color: var(--brick); padding: 12px; border-radius: var(--radius); font-size: 0.9rem; margin-bottom: 20px; display: none; border: 1px solid var(--brick); }
  .auth-footer { text-align: center; margin-top: 24px; font-size: 0.9rem; color: var(--ink-soft); }
  .auth-footer a { font-weight: 600; }
</style>
</head>
<body>
<div class="topbar">
  <a href="./index.html" class="brand" style="text-decoration:none;"><span class="pulse-dot"></span>Algocare</a>
</div>

<div class="auth-container">
  <h2>Create Account</h2>
  <div id="authError" class="auth-error"></div>
  
  <form id="signupForm">
    <div class="form-group">
      <label>Full Name</label>
      <input type="text" id="name" class="form-control" required placeholder="John Doe">
    </div>
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="email" class="form-control" required placeholder="you@example.com">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="password" class="form-control" required placeholder="••••••••">
    </div>
    <div class="form-group">
      <label>Confirm Password</label>
      <input type="password" id="confirmPassword" class="form-control" required placeholder="••••••••">
    </div>
    
    <button type="submit" class="btn" style="width:100%; margin-top: 8px;" id="submitBtn">Sign Up</button>
  </form>
  
  <div class="auth-footer">
    Already have an account? <a href="./login.html">Log In</a>
  </div>
</div>

<script src="./assets/auth.js"></script>
<script>
  document.getElementById("signupForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    
    const btn = document.getElementById("submitBtn");
    const err = document.getElementById("authError");
    const pass = document.getElementById("password").value;
    const confirmPass = document.getElementById("confirmPassword").value;
    
    err.style.display = "none";
    
    if (pass !== confirmPass) {
      err.textContent = "Passwords do not match.";
      err.style.display = "block";
      return;
    }
    
    btn.disabled = true;
    btn.textContent = "Creating account...";
    
    try {
      const data = await signUp(
        document.getElementById("name").value,
        document.getElementById("email").value,
        pass
      );
      
      // If email confirmation is turned OFF in Supabase, they log in immediately
      if (data.access_token) {
        window.location.href = "./dashboard.html";
      } else {
        // If email confirmation is ON, tell them to check their email
        document.querySelector(".auth-container").innerHTML = `
          <h2 style="text-align:center; color: var(--scrub);">Check your email</h2>
          <p style="text-align:center; color: var(--ink-soft);">We sent a confirmation link to <strong>${document.getElementById("email").value}</strong>.<br>Click it to activate your account.</p>
          <a href="./login.html" class="btn" style="width:100%; display:block; margin-top:20px;">Go to Login</a>
        `;
      }
    } catch (error) {
      err.textContent = error.message;
      err.style.display = "block";
      btn.disabled = false;
      btn.textContent = "Sign Up";
    }
  });
</script>
</body>
</html>
