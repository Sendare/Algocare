<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up — Algocare</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/style.css">
<style>
  .auth-container { max-width: 420px; margin: 60px auto; padding: 32px; background: var(--card); border: 1px solid var(--grey-line); border-radius: 12px; box-shadow: var(--shadow); }
  .auth-container h2 { text-align: center; margin-bottom: 24px; font-size: 1.75rem; }
  .auth-error { background: var(--brick-soft); color: var(--brick); padding: 12px; border-radius: var(--radius); font-size: 0.9rem; margin-bottom: 20px; display: none; border: 1px solid var(--brick); }
  .auth-footer { text-align: center; margin-top: 24px; font-size: 0.9rem; color: var(--ink-soft); }
  .auth-footer a { font-weight: 600; }
</style>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#F7F8F7">

</head>
<body>
<div class="topbar">
  <a href="/index.html" class="brand" style="text-decoration:none;"><span class="pulse-dot"></span>Algocare</a>
</div>

<div class="auth-container">
  <h2>Create Account</h2>
  <div id="authError" class="auth-error"></div>
  
  <form id="signupForm">
    <div class="form-group">
      <label>Full Name</label>
      <input type="text" id="name" class="form-control" required placeholder="John Doe">
    </div>
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="email" class="form-control" required placeholder="you@example.com">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="password" class="form-control" required placeholder="••••••••">
    </div>
    <div class="form-group">
      <label>Confirm Password</label>
      <input type="password" id="confirmPassword" class="form-control" required placeholder="••••••••">
    </div>
    
    

    <!-- Honeypot (Bots will fill this, humans won't) -->
    <div style="display:none;">
      <input type="text" id="website_url" name="website_url" tabindex="-1" autocomplete="off">
    </div>

    <!-- Math Challenge -->
    <div class="form-group" style="background: var(--paper); padding: 12px; border-radius: var(--radius); border: 1px solid var(--grey-line);">
      <label style="color: var(--ink);">Security Check: <span id="math-question"></span> = ?</label>
      <input type="number" id="math-answer" class="form-control" required placeholder="Enter the answer">
    </div>

    <div class="form-group" style="display: flex; align-items: flex-start; gap: 10px; margin-bottom: 16px;">
        <input type="checkbox" id="agreeTerms" required style="width: 18px; height: 18px; margin-top: 2px; accent-color: var(--scrub); cursor: pointer;">
        <label for="agreeTerms" style="font-size: 0.85rem; color: var(--ink-soft); line-height: 1.4; cursor: pointer; font-family: var(--body); text-transform: none; letter-spacing: normal;">
          I agree to the <a href="/terms.html" target="_blank" style="color: var(--scrub); font-weight: 600;">Terms & Disclaimer</a> and <a href="/privacy.html" target="_blank" style="color: var(--scrub); font-weight: 600;">Privacy Policy</a>.
        </label>
      </div>
      <button type="submit" class="btn" style="width:100%; margin-top: 8px;" id="submitBtn">Sign Up</button>
  </form>

  <div style="text-align: center; margin-top: 32px; font-size: 0.8rem; color: var(--ink-soft);">
    <a href="/terms.html" style="color: var(--ink-soft); text-decoration: none; margin: 0 8px;">Terms</a> • 
    <a href="/privacy.html" style="color: var(--ink-soft); text-decoration: none; margin: 0 8px;">Privacy</a>
  </div>

  
  <div class="auth-footer">
    Already have an account? <a href="/login.html" id="goToLogin">Log In</a>
  </div>
</div>

<script src="/assets/auth.js"></script>

<script>
  // Generate simple math question
  const num1 = Math.floor(Math.random() * 10) + 1;
  const num2 = Math.floor(Math.random() * 10) + 1;
  const correctAnswer = num1 + num2;
  document.getElementById('math-question').textContent = `${num1} + ${num2}`;

  document.getElementById("signupForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    
    const btn = document.getElementById("submitBtn");
    const err = document.getElementById("authError");
    const pass = document.getElementById("password").value;
    const confirmPass = document.getElementById("confirmPassword").value;
    const honeypot = document.getElementById("website_url").value;
    const mathAns = parseInt(document.getElementById("math-answer").value);

    err.style.display = "none";
    
    // 1. Honeypot check
    if (honeypot !== "") {
      err.textContent = "Bot detected. Please refresh.";
      err.style.display = "block";
      return;
    }

    // 2. Math check
    if (mathAns !== correctAnswer) {
      err.textContent = "Incorrect math answer. Please try again.";
      err.style.display = "block";
      return;
    }

    // 3. Password check
    if (pass !== confirmPass) {
      err.textContent = "Passwords do not match.";
      err.style.display = "block";
      return;
    }
    
    btn.disabled = true;
    btn.textContent = "Creating account...";
    
    try {
      const data = await signUp(
        document.getElementById("name").value,
        document.getElementById("email").value,
        pass
      );
      
      if (data.access_token) {
        window.location.href = "/dashboard";
      } else {
        window.location.href = "/login?msg=confirm_email";
      }
    } catch (error) {
      err.textContent = error.message;
      err.style.display = "block";
      btn.disabled = false;
      btn.textContent = "Sign Up";
    }
  });
</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("/sw.js", { scope: "/", updateViaCache: "none" }).catch(() => {});
  });
}
</script>



<script>
  // Preserve the ?next= parameter when clicking "Log In"
  document.addEventListener("DOMContentLoaded", () => {
    const loginLink = document.querySelector('.auth-footer a');
    if (loginLink && window.location.search) {
      loginLink.href = '/login' + window.location.search;
    }
  });
</script>

<script>
  document.addEventListener("DOMContentLoaded", () => {
    const urlParams = new URLSearchParams(window.location.search);
    const nextParam = urlParams.get("next");
    if (nextParam) {
      const loginLink = document.getElementById("goToLogin");
      if (loginLink) loginLink.href = `/login.html?next=${encodeURIComponent(nextParam)}`;
    }
  });
</script>
</body>
</html>
