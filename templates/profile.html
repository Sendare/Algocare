<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Profile — Algocare</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/style.css">
<style>
  .profile-card { background: var(--card); padding: 32px; border-radius: 12px; border: 1px solid var(--grey-line); max-width: 500px; margin: 40px auto; box-shadow: var(--shadow); }
  .avatar-upload { display: flex; flex-direction: column; align-items: center; margin-bottom: 24px; }
  .avatar-preview { width: 100px; height: 100px; border-radius: 50%; object-fit: cover; background: var(--paper); border: 2px solid var(--scrub); margin-bottom: 12px; display: flex; align-items: center; justify-content: center; font-size: 2rem; color: var(--scrub); font-weight: bold; overflow: hidden;}
  .file-input { display: none; }
  .btn-upload { background: var(--scrub-soft); color: var(--scrub); padding: 8px 16px; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 0.85rem; border: 1px solid var(--scrub); }
  .btn-upload:hover { background: var(--scrub); color: #fff; }
</style>
</head>
<body>
<div class="topbar">
  <a href="/dashboard" class="brand" style="text-decoration:none;"><span class="pulse-dot"></span>Algocare</a>
  <div id="authSlot"></div>
</div>

<div class="container">
  <div class="profile-card">
    <h2 style="text-align:center;">Profile Settings</h2>
    
    <form id="profileForm">
      <div class="avatar-upload">
        <div class="avatar-preview" id="avatarPreview">A</div>
        <input type="file" id="avatarInput" class="file-input" accept="image/*">
        <label for="avatarInput" class="btn-upload">Upload New Photo</label>
      </div>

      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="profileName" class="form-control" disabled style="background:var(--paper);">
      </div>

      <div class="form-group">
        <label>Bio (Tell us about yourself)</label>
        <textarea id="profileBio" class="form-control" rows="3" placeholder="e.g., Final year Nursing student at University of Lagos."></textarea>
      </div>

      <button type="submit" class="btn" style="width:100%;" id="saveBtn">Save Changes</button>
    </form>
  </div>
</div>

<script src="/assets/auth.js"></script>
<script src="/assets/profile.js"></script>
</body>
</html>
