<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Practice Setup — Algocare</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/style.css">
<style>
  .setup-container { max-width: 600px; margin: 40px auto; background: var(--card); padding: 32px; border-radius: 12px; border: 1px solid var(--grey-line); box-shadow: var(--shadow); }
  .setup-header { text-align: center; margin-bottom: 32px; }
  .setup-header h1 { font-size: 1.8rem; margin-bottom: 8px; }
  .setup-header p { color: var(--ink-soft); margin: 0; }
  
  .course-list { max-height: 250px; overflow-y: auto; border: 1px solid var(--grey-line); border-radius: var(--radius); padding: 12px; background: var(--paper); margin-bottom: 20px; }
  .course-item { display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 6px; cursor: pointer; transition: background 0.2s; }
  .course-item:hover { background: var(--card); }
  .course-item input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--scrub); cursor: pointer; }
  .course-item label { cursor: pointer; font-weight: 500; color: var(--ink); font-size: 0.95rem; flex: 1; }
  
  .row { display: flex; gap: 16px; }
  .row .form-group { flex: 1; }
  
  .btn-start { width: 100%; padding: 16px; font-size: 1.1rem; margin-top: 12px; }
</style>
</head>
<body>
<div class="topbar">
  <a href="../dashboard.html" class="brand" style="text-decoration:none;"><span class="pulse-dot"></span>Algocare</a>
  <a href="../dashboard.html" style="font-size:0.9rem; color:var(--ink-soft); font-weight:600; text-decoration:none;">← Back to Dashboard</a>
</div>

<div class="setup-container">
  <div class="setup-header">
    <h1>Practice Mode</h1>
    <p>Customize your test below.</p>
  </div>

  <form id="practiceForm">
    <div class="form-group">
      <label>Select Courses</label>
      <div class="course-list" id="courseList">
        <div class="empty-state" style="padding:20px; font-size:0.9rem;">Loading courses...</div>
      </div>
    </div>

    <div class="row">
      <div class="form-group">
        <label>Number of Questions</label>
        <input type="number" id="questionCount" class="form-control" value="20" min="1" required>
      </div>
      <div class="form-group">
        <label>Seconds per Question</label>
        <select id="spq" class="form-control">
          <option value="15">15 seconds</option>
          <option value="30" selected>30 seconds</option>
          <option value="45">45 seconds</option>
          <option value="60">60 seconds</option>
        </select>
      </div>
    </div>

    <button type="submit" class="btn btn-start" id="startBtn">Start Practice Test</button>
  </form>
</div>

<script src="../assets/auth.js"></script>
<script>
  // Determine program from URL (e.g., ?prog=midwifery), default to nursing
  const params = new URLSearchParams(window.location.search);
  const prog = params.get("prog") || "nursing";
  const courseListEl = document.getElementById("courseList");

  // Fetch available courses for this program from site_index.json
  async function loadCourses() {
    try {
      const res = await fetch(`../site_index.json`);
      const data = await res.json();
      
      // Extract unique courses
      const courseMap = {};
      data.forEach(item => {
        if (!courseMap[item.course_slug]) {
          courseMap[item.course_slug] = item.course;
        }
      });

      if (Object.keys(courseMap).length === 0) {
        courseListEl.innerHTML = '<div class="empty-state" style="padding:20px; font-size:0.9rem;">No courses found.</div>';
        return;
      }

      // Render checkboxes
      courseListEl.innerHTML = Object.entries(courseMap)
        .sort((a, b) => a[1].localeCompare(b[1]))
        .map(([slug, name]) => `
          <div class="course-item">
            <input type="checkbox" id="course_${slug}" value="${slug}">
            <label for="course_${slug}">${name}</label>
          </div>
        `).join("");
        
    } catch (err) {
      console.error(err);
      courseListEl.innerHTML = '<div class="empty-state" style="padding:20px; font-size:0.9rem; color:var(--brick);">Error loading courses.</div>';
    }
  }

  // Handle form submission
  document.getElementById("practiceForm").addEventListener("submit", (e) => {
    e.preventDefault();
    
    const checkboxes = document.querySelectorAll('#courseList input[type="checkbox"]:checked');
    if (checkboxes.length === 0) {
      alert("Please select at least one course.");
      return;
    }

    const selectedCourses = Array.from(checkboxes).map(cb => cb.value).join(",");
    const count = document.getElementById("questionCount").value;
    const spq = document.getElementById("spq").value;
    const topicId = params.get("topic");

    // Build the URL
    let url = `exam.html?mode=practice&courses=${selectedCourses}&count=${count}&spq=${spq}&prog=${prog}`;
    
    // If coming from an article, append the topic ID
    if (topicId) {
      url += `&topic=${topicId}`;
    }

    window.location.href = url;
  });

  loadCourses();
</script>
</body>
</html>
