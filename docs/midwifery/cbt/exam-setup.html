<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Real-Feel Exam — Algocare</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/style.css">
<style>
  .setup-container { max-width: 600px; margin: 40px auto; background: var(--card); padding: 32px; border-radius: 12px; border: 1px solid var(--grey-line); box-shadow: var(--shadow); }
  .setup-header { text-align: center; margin-bottom: 32px; }
  .setup-header h1 { font-size: 1.8rem; margin-bottom: 8px; color: var(--scrub); }
  .setup-header p { color: var(--ink-soft); margin: 0; }
  
  .exam-list { display: flex; flex-direction: column; gap: 12px; }
  .exam-card { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; background: var(--paper); border: 1px solid var(--grey-line); border-radius: var(--radius); transition: all 0.2s; }
  .exam-card:hover { border-color: var(--scrub); background: var(--card); transform: translateY(-1px); box-shadow: 0 2px 8px rgba(47,111,98,0.05); }
  .exam-title { font-weight: 600; color: var(--ink); font-size: 1.05rem; }
  .exam-meta { font-family: var(--mono); font-size: 0.75rem; color: var(--grey); margin-top: 4px; }
  .btn-attempt { background: var(--scrub); color: #fff; padding: 8px 16px; border-radius: 6px; font-weight: 700; font-size: 0.85rem; text-decoration: none; }
  .btn-attempt:hover { opacity: 0.9; }
</style>
</head>
<body>
<div class="topbar">
  <a href="../dashboard.html" class="brand" style="text-decoration:none;"><span class="pulse-dot"></span>Algocare</a>
  <a href="../dashboard.html" style="font-size:0.9rem; color:var(--ink-soft); font-weight:600; text-decoration:none;">← Back to Dashboard</a>
</div>

<div class="setup-container">
  <div class="setup-header">
    <h1>Real-Feel Exam</h1>
    <p>250 questions · Strict timing · No explanations.</p>
  </div>

  <div class="exam-list" id="examList">
    <div class="empty-state">Loading available exams...</div>
  </div>
</div>

<script src="../assets/auth.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const prog = params.get("prog") || "nursing";
  const examListEl = document.getElementById("examList");

  async function loadExams() {
    try {
      // Fetch the index of generated real-feel exams
      const res = await fetch(`../data/real_feel_tests/index.json`);
      
      if (!res.ok) {
        // If the file doesn't exist yet, show a friendly message
        examListEl.innerHTML = `<div class="empty-state" style="padding: 32px; background: var(--paper); border-radius: 8px;">
          <p style="font-size: 1.1rem; margin-bottom: 8px;">No exams generated yet.</p>
          <p style="font-size: 0.9rem;">Please run the Python build script to generate the Real-Feel Exams.</p>
        </div>`;
        return;
      }

      const data = await res.json();
      const tests = data.tests || [];

      if (tests.length === 0) {
        examListEl.innerHTML = `<div class="empty-state">No exams available right now.</div>`;
        return;
      }

      // Render the list of exams
      examListEl.innerHTML = tests.map(n => `
        <div class="exam-card">
          <div>
            <div class="exam-title">Real-Feel Exam ${n}</div>
            <div class="exam-meta">250 Questions · 125 mins</div>
          </div>
          <a href="exam.html?mode=real_feel&test=${n}&prog=${prog}" class="btn-attempt">Attempt →</a>
        </div>
      `).join("");

    } catch (err) {
      console.error(err);
      examListEl.innerHTML = `<div class="empty-state" style="color: var(--brick);">Error loading exams. Please try again later.</div>`;
    }
  }

  loadExams();
</script>
</body>
</html>
