<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CANARY TEST</title>
    <style>
        body { background-color: #00ff00; color: #000000; font-family: monospace; text-align: center; padding-top: 50px; }
        h1 { font-size: 2.5rem; }
        .box { background: white; padding: 20px; border-radius: 10px; display: inline-block; margin-top: 20px; border: 3px solid black; }
    </style>
</head>
<body>
    <h1>🎉 CANARY FILE LOADED! 🎉</h1>

        <p><strong>Time Loaded:</strong> <span id="time"></span></p>
        <p><strong>URL:</strong> <span id="url"></span></p>
        <p style="color: green; font-weight: bold; margin-top: 20px;">
            If you can see this green screen, your deployment pipeline is 100% working.
        </p>
    </div>
    <script>
        document.getElementById('time').textContent = new Date().toLocaleString();
        document.getElementById('url').textContent = window.location.href;
    </script>
</body>
</html>
