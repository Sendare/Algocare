name: Restructure Once (delete after running)

on:
  workflow_dispatch:

jobs:
  restructure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run migration
        run: python restructure_program_layout.py

      - name: Commit and push restructured repo
        run: |
          git config user.name "algocare-bot"
          git config user.email "algocare-bot@users.noreply.github.com"
          git add -A
          git commit -m "Restructure into program-namespaced layout (nursing)"
          git pull --rebase
          git push
