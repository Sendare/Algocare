name: Apply JAMB UI Overhaul
on:
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Apply Patch
        run: python patches/apply_jamb_ui.py
      - name: Rebuild Programs
        run: |
          python build_pages.py nursing
          python build_pages.py midwifery
      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "Apply JAMB UI Overhaul, Calculator, and Theme Toggle"
          git push
