name: Fetch Articles (Midwifery)

# Triggered externally by cron-job.org (or similar) hitting the GitHub API's
# "workflow_dispatch" endpoint every ~10 minutes. Same short-burst pattern as
# fetch_headings.yml, kept separate since articles depend on headings already
# being ready and are a heavier AI call per topic.
on:
  workflow_dispatch:

jobs:
  fetch-articles:
    runs-on: ubuntu-latest
    timeout-minutes: 8   # outer safety net; script itself self-stops at 4.5 min

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run fetch_articles.py
        env:
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
        run: python fetch_articles.py midwifery

      - name: Commit and push updated data/state
        run: |
          git config user.name "algocare-bot"
          git config user.email "algocare-bot@users.noreply.github.com"
          git add data/midwifery/articles data/midwifery/questions state/midwifery/generation_state.json
          git diff --cached --quiet || git commit -m "Update midwifery articles + questions [automated]"
          git pull --rebase
          git push
