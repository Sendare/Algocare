name: Auto Build Algocare
on:
  schedule:
    - cron: '*/15 * * * *' # Runs every 15 minutes
  workflow_dispatch: # Manual trigger

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Build
        # -u forces Python to print logs immediately without buffering
        run: python -u scripts/build.py

      - name: Commit and Push
        run: |
          git config user.name "algocare-bot"
          git config user.email "algocare-bot@users.noreply.github.com"
          
          echo "Staging files..."
          git add docs/
          
          echo "Committing..."
          git diff --cached --quiet || git commit -m "Auto-build: Batch [skip ci]"
          
          echo "Pushing to GitHub..."
          git push origin main -f
          echo "Done!"
