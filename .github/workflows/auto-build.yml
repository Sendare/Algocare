name: Auto Build Algocare
on:
  schedule:
    - cron: '*/5 * * * *' # Runs every 5 minutes
  workflow_dispatch: # Manual trigger

concurrency:
  group: auto-build
  cancel-in-progress: true # Prevents overlapping builds

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Build
        run: python scripts/build.py

      - name: Commit and Push
        run: |
          git config user.name "algocare-bot"
          git config user.email "algocare-bot@users.noreply.github.com"
          git add docs/
          git diff --cached --quiet || git commit -m "Auto-build: Batch [skip ci]"
          # Force push skips the slow pull/rebase process entirely
          git push origin main -f
