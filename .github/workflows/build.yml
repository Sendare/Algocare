name: Build Algocare Site (Incremental)
on:
  workflow_dispatch: # Manual trigger

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # --- CHUNK 1: ROOT ---
      - name: Build Root
        run: python scripts/build.py root

      - name: Commit Root
        run: |
          git config user.name "algocare-bot"
          git config user.email "algocare-bot@users.noreply.github.com"
          git add docs/ state/
          git diff --cached --quiet || git commit -m "Build: Root pages & assets"
          git pull --rebase origin main || true
          git push

      # --- CHUNK 2: NURSING (Loop 100 at a time) ---
      - name: Build Nursing (Incremental)
        run: |
          git config user.name "algocare-bot"
          git config user.email "algocare-bot@users.noreply.github.com"
          
          while true; do
            OUTPUT=$(python scripts/build.py nursing)
            echo "$OUTPUT"
            
            git add docs/ state/
            if ! git diff --cached --quiet; then
              git commit -m "Build: Nursing batch [skip ci]"
              git pull --rebase origin main || true
              git push
            fi
            
            if echo "$OUTPUT" | grep -q "BATCH_COMPLETE_ALL_DONE"; then
              break
            fi
          done

      # --- CHUNK 3: MIDWIFERY (Loop 100 at a time) ---
      - name: Build Midwifery (Incremental)
        run: |
          git config user.name "algocare-bot"
          git config user.email "algocare-bot@users.noreply.github.com"
          
          while true; do
            OUTPUT=$(python scripts/build.py midwifery)
            echo "$OUTPUT"
            
            git add docs/ state/
            if ! git diff --cached --quiet; then
              git commit -m "Build: Midwifery batch [skip ci]"
              git pull --rebase origin main || true
              git push
            fi
            
            if echo "$OUTPUT" | grep -q "BATCH_COMPLETE_ALL_DONE"; then
              break
            fi
          done
