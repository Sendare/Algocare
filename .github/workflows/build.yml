name: Build Algocare Site (Chunked)
on:
  workflow_dispatch: # Manual trigger

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # --- CHUNK 1: ROOT ---
      - name: Build Root
        run: python scripts/build.py root

      - name: Commit Root
        run: |
          git config user.name "algocare-bot"
          git config user.email "algocare-bot@users.noreply.github.com"
          git add docs/
          git diff --cached --quiet || git commit -m "Build: Root pages & assets"
          git pull --rebase origin main
          git push

      # --- CHUNK 2: NURSING ---
      - name: Build Nursing
        run: python scripts/build.py nursing

      - name: Commit Nursing
        run: |
          git config user.name "algocare-bot"
          git config user.email "algocare-bot@users.noreply.github.com"
          git add docs/
          git diff --cached --quiet || git commit -m "Build: Nursing program"
          git pull --rebase origin main
          git push

      # --- CHUNK 3: MIDWIFERY ---
      - name: Build Midwifery
        run: python scripts/build.py midwifery

      - name: Commit Midwifery
        run: |
          git config user.name "algocare-bot"
          git config user.email "algocare-bot@users.noreply.github.com"
          git add docs/
          git diff --cached --quiet || git commit -m "Build: Midwifery program"
          git pull --rebase origin main
          git push
