name: Build Pages
on:
  schedule:
    - cron: '0 * * * *' # Hourly
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -r requirements.txt
      - run: python build_pages.py nursing
      - run: python build_pages.py midwifery
      - name: Commit and Push
        run: |
          git config user.name "algocare-bot"
          git config user.email "algocare-bot@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "Build pages [automated]"
          git pull --rebase --autostash
          git push
