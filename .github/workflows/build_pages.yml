name: Build Pages (GitHub Pages)
on:
  workflow_dispatch: # Manual trigger only

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -r requirements.txt
      
      # Build both programs with force to ensure all pages are generated
      - run: python build_pages.py nursing --force
      - run: python build_pages.py midwifery --force
      
      # Commit the newly generated files to the repo (this triggers GitHub Pages)
      - name: Commit and Push
        run: |
          git config user.name "algocare-bot"
          git config user.email "algocare-bot@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "Build pages [automated]"
          git push
