name: Build Pages (Midwifery)

# No AI calls in this job, so no rate-limit reason to use an external cron -
# GitHub's own schedule trigger runs it hourly. workflow_dispatch is kept as
# a manual fallback for testing.
on:
  schedule:
    - cron: "* * * * *"   # every hour, on the hour
  workflow_dispatch:

jobs:
  build-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 6   # outer safety net; script itself self-stops at 4.5 min

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run build_pages.py
        run: python build_pages.py midwifery

      - name: Commit and push updated pages/state
        run: |
          git config user.name "algocare-bot"
          git config user.email "algocare-bot@users.noreply.github.com"
          git add docs/midwifery state/midwifery/build_state.json state/midwifery/real_feel_state.json
          git diff --cached --quiet || git commit -m "Build midwifery pages [automated]"
          git pull --rebase
          git push
