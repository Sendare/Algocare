name: Algocare Auto Post

concurrency:
  group: algocare-publishing
  cancel-in-progress: false


on:
  # Cron-job.org hits this webhook to trigger a post
  repository_dispatch:
    types: [trigger_post]

  # Backup: GitHub native schedule (UTC times)
  schedule:
    - cron: '0 5 * * *'    # 06:00 GST
    - cron: '30 7 * * *'   # 08:30 GST
    - cron: '30 9 * * *'   # 10:30 GST
    - cron: '30 11 * * *'  # 12:30 GST
    - cron: '30 13 * * *'  # 14:30 GST
    - cron: '30 15 * * *'  # 16:30 GST
    - cron: '30 17 * * *'  # 18:30 GST
    - cron: '0 20 * * *'   # 21:00 GST

  # Manual trigger from GitHub UI
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # Fetch all history so rebase operations are clean and stable
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Algocare
        env:
          GEMINI_API_KEY:        ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL:          gemini-2.0-flash
          TELEGRAM_BOT_TOKEN:    ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:      ${{ secrets.TELEGRAM_CHAT_ID }}
          FACEBOOK_PAGE_TOKEN:   ${{ secrets.FACEBOOK_PAGE_TOKEN }}
          FACEBOOK_PAGE_ID:      ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_API_VERSION:  v19.0
        run: python main.py run

      - name: Commit memory updates
        run: |
          git config user.name  "Algocare Bot"
          git config user.email "bot@algocare"
          
          # Force track flat-file directories to clear the .gitignore restriction safely
          git add -f engines/memory/ || true
          git add -f published/ || true
          git add -f logs/ || true
          git add -f workflow_logs/ || true
          git add -f publish_logs/ || true
          
          # Explicitly unstage internal python cache files so they never trigger push blockages
          git rm -r --cached *__pycache__* || true
          
          # Run a safety rebase pull before pushing to seamlessly merge parallel background schedule tasks
          if ! git diff --staged --quiet; then
            git commit -m "auto: post $(date -u '+%Y-%m-%d %H:%M')"
            git pull --rebase origin main
            git push origin main
          fi
