name: Algocare Auto Post

concurrency:
  group: algocare-publishing
  cancel-in-progress: false

on:
  # Webhook trigger from cron-job.org
  repository_dispatch:
    types: [trigger_post]

  # Manual trigger from GitHub UI
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Authenticate with a persistent token to guarantee write clearance
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Sync and Reset Local Branch Slate
        run: |
          git config user.name  "Algocare Bot"
          git config user.email "bot@algocare"
          
          # Force the local workspace to align perfectly with the online remote state
          git fetch origin main
          git reset --hard origin/main

      - name: Run Algocare
        env:
          GEMINI_API_KEY:        ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL:          gemini-2.0-flash
          TELEGRAM_BOT_TOKEN:    ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:      ${{ secrets.TELEGRAM_CHAT_ID }}
          FACEBOOK_PAGE_TOKEN:   ${{ secrets.FACEBOOK_PAGE_TOKEN }}
          FACEBOOK_PAGE_ID:      ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_API_VERSION:  v19.0
          PYTHONUNBUFFERED:      "1"
        run: python main.py run

      - name: Commit and Force Sync State
        run: |
          # Force stage database updates, ignoring tracking blockages
          git add -f config/*.json || true
          git add -f engines/memory/*.json || true
          git add -f published/*.json || true
          git add -f logs/*.log || true
          git add -f workflow_logs/ || true
          git add -f publish_logs/ || true
          
          # Unstage python compiler files cleanly
          git rm -r --cached *__pycache__* || true
          
          # Push mutations up directly using an upstream sequence track
          if ! git diff --staged --quiet; then
            git commit -m "auto: engine log update $(date -u '+%Y-%m-%d %H:%M')"
            
            # Rebase cleanly to verify state order before deploying upstream
            git pull --rebase origin main
            git push origin main
          else
            echo "No mutations detected in flat files. Skipping commit push."
          fi
